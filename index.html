<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFB Live Monitor - Compact Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-live: #ef4444;
            --accent-final: #64748b;
            --accent-upcoming: #3b82f6;
            --highlight: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 12px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
            gap: 8px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
        }

        select:focus, button:focus {
            outline: 1px solid var(--highlight);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .pulse {
            width: 7px;
            height: 7px;
            background-color: var(--accent-live);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }

        /* Ultra-dense Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 8px;
        }

        /* Game Box */
        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 7px 9px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: border-color 0.15s ease;
        }

        .game-card:hover {
            border-color: var(--text-muted);
        }

        /* Header Info (Clock & Quarter) */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .game-status.live {
            color: var(--accent-live);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .game-status.live::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            background-color: var(--accent-live);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .game-status.final {
            color: var(--accent-final);
        }

        .game-status.upcoming {
            color: var(--accent-upcoming);
        }

        /* Teams section */
        .teams-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            padding-right: 4px;
        }

        .team-logo {
            width: 15px;
            height: 15px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .team-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-row.winner .team-name,
        .team-row.winner .team-score {
            font-weight: 700;
            color: var(--text-main);
        }

        .team-row:not(.winner) .team-name,
        .team-row:not(.winner) .team-score {
            color: var(--text-muted);
        }

        .team-score {
            font-variant-numeric: tabular-nums;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        /* Broadcast / Situation Footer */
        .game-footer {
            margin-top: 5px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .broadcast {
            font-weight: 500;
        }

        .situation {
            color: #fbbf24;
            font-weight: 500;
        }

        /* States */
        .loading, .error, .no-games {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .error {
            color: var(--accent-live);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>CFB Live</h1>
            <div class="status-indicator">
                <div class="pulse"></div>
                <span id="update-status">Live</span>
            </div>
        </div>
        <div class="controls">
            <select id="filter-select" onchange="filterGames()">
                <option value="all">All Games</option>
                <option value="live" selected>Live Only</option>
                <option value="top25">Top 25 Only</option>
                <option value="final">Finals</option>
            </select>
            <button onclick="fetchScores()">Refresh</button>
        </div>
    </header>

    <main>
        <div id="games-container" class="games-grid">
            <div class="loading">Loading college football scores...</div>
        </div>
    </main>

    <script>
        let allGamesData = [];

        async function fetchScores() {
            const container = document.getElementById('games-container');
            const statusEl = document.getElementById('update-status');
            statusEl.textContent = 'Updating...';

            try {
                // ESPN public CFB scoreboard endpoint targeting all FBS teams (groups=80)
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                allGamesData = data.events || [];
                
                renderGames();
                statusEl.textContent = 'Live';
            } catch (error) {
                console.error("Error fetching scores:", error);
                statusEl.textContent = 'Error updating';
                if (allGamesData.length === 0) {
                    container.innerHTML = `<div class="error">Unable to load live scores right now. Please check your connection or try refreshing.</div>`;
                }
            }
        }

        function filterGames() {
            renderGames();
        }

        function renderGames() {
            const container = document.getElementById('games-container');
            const filter = document.getElementById('filter-select').value;

            if (!allGamesData || allGamesData.length === 0) {
                container.innerHTML = `<div class="no-games">No games scheduled or available at the moment.</div>`;
                return;
            }

            let filtered = allGamesData.filter(event => {
                const status = event.status.type.state; // 'pre', 'in', 'post'
                const competitions = event.competitions[0];
                const homeTeam = competitions.competitors.find(c => c.homeAway === 'home');
                const awayTeam = competitions.competitors.find(c => c.homeAway === 'away');
                const isTop25 = (homeTeam.curatedRank?.current <= 25) || (awayTeam.curatedRank?.current <= 25);

                if (filter === 'live') return status === 'in';
                if (filter === 'final') return status === 'post';
                if (filter === 'top25') return isTop25;
                return true; // 'all'
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-games">No games match the selected filter ("${filter}"). Try switching to "All Games".</div>`;
                return;
            }

            container.innerHTML = filtered.map(event => {
                const comp = event.competitions[0];
                const statusState = event.status.type.state; // pre, in, post
                const statusDetail = event.status.type.detail; // e.g., "3rd - 4:12", "Final", "Sat, 7:00 PM"
                const broadcast = comp.broadcasts?.[0]?.names?.[0] || '';
                const situation = comp.situation ? comp.situation.downDistanceText : '';

                const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
                const awayTeam = comp.competitors.find(c => c.homeAway === 'away');

                const homeScore = parseInt(homeTeam.score || 0);
                const awayScore = parseInt(awayTeam.score || 0);

                let homeWinner = false;
                let awayWinner = false;
                if (statusState === 'post') {
                    if (homeScore > awayScore) homeWinner = true;
                    else if (awayScore > homeScore) awayWinner = true;
                }

                let statusClass = 'upcoming';
                let statusText = statusDetail;
                if (statusState === 'in') {
                    statusClass = 'live';
                } else if (statusState === 'post') {
                    statusClass = 'final';
                    statusText = 'FINAL';
                }

                const homeRank = homeTeam.curatedRank?.current <= 25 ? `#${homeTeam.curatedRank.current} ` : '';
                const awayRank = awayTeam.curatedRank?.current <= 25 ? `#${awayTeam.curatedRank.current} ` : '';

                return `
                    <div class="game-card">
                        <div class="game-header">
                            <span class="game-status ${statusClass}">${statusText}</span>
                            <span class="broadcast">${broadcast}</span>
                        </div>
                        <div class="teams-list">
                            <div class="team-row ${awayWinner ? 'winner' : ''}">
                                <div class="team-info">
                                    <img class="team-logo" src="${awayTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                    <span class="team-name">${awayRank}${awayTeam.team.shortDisplayName || awayTeam.team.name}</span>
                                </div>
                                <span class="team-score">${awayTeam.score ?? '0'}</span>
                            </div>
                            <div class="team-row ${homeWinner ? 'winner' : ''}">
                                <div class="team-info">
                                    <img class="team-logo" src="${homeTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                    <span class="team-name">${homeRank}${homeTeam.team.shortDisplayName || homeTeam.team.name}</span>
                                </div>
                                <span class="team-score">${homeTeam.score ?? '0'}</span>
                            </div>
                        </div>
                        ${situation || (statusState === 'in' && event.status.period) ? `
                        <div class="game-footer">
                            <span class="situation">${situation || ''}</span>
                            <span></span>
                        </div>` : ''}
                    </div>
                `;
            }).join('');
        }

        // Initial fetch
        fetchScores();

        // Auto-refresh every 20 seconds for live monitoring
        setInterval(fetchScores, 20000);
    </script>
</body>
</html>
