<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's CFP Scoreboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1329;       
            --card-bg: #1e293b;        
            --card-border: #475569;    
            --text-main: #ffffff;      
            --text-muted: #cbd5e1;     
            --accent-live: #f87171;    
            --accent-final: #94a3b8;   
            --accent-upcoming: #60a5fa;
            --highlight: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 12px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .week-display {
            font-size: 0.75rem;
            background-color: #172033;
            border: 1px solid var(--card-border);
            padding: 3px 8px;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        select, button {
            background-color: #27354f;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
        }

        select:focus, button:focus {
            outline: 1px solid var(--highlight);
        }

        .wake-lock-btn {
            background-color: #27354f;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            display: none; 
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        @media (min-width: 768px) {
            .wake-lock-btn {
                display: flex; 
            }
        }

        .wake-lock-btn.active {
            background-color: rgba(37, 99, 235, 0.3);
            border-color: var(--highlight);
            color: var(--text-main);
            font-weight: 600;
        }

        .wake-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .wake-lock-btn.active .wake-dot {
            background-color: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--accent-live);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-box {
            background-color: #172033;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.03em;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1rem;
            font-variant-numeric: tabular-nums;
        }

        .stat-box.live .stat-value { color: var(--accent-live); }
        .stat-box.final .stat-value { color: var(--accent-final); }
        .stat-box.upcoming .stat-value { color: var(--accent-upcoming); }
        .stat-box.total .stat-value { color: var(--text-main); }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: border-color 0.15s ease;
        }

        .game-card:hover {
            border-color: #94a3b8;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .game-status.live {
            color: var(--accent-live);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .game-status.live::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--accent-live);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .game-status.final {
            color: var(--accent-final);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .game-status.upcoming {
            color: var(--text-muted);
            font-size: 0.62rem;
            text-transform: none;
            font-weight: 500;
        }

        .teams-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            padding-right: 6px;
        }

        .team-logo {
            width: 16px;
            height: 16px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .team-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-row.winner .team-name,
        .team-row.winner .team-score {
            font-weight: 700;
            color: #ffffff;
        }

        .team-row:not(.winner) .team-name,
        .team-row:not(.winner) .team-score {
            color: #94a3b8;
        }

        .team-score {
            font-variant-numeric: tabular-nums;
            font-size: 0.92rem;
            flex-shrink: 0;
        }

        .broadcast {
            font-weight: 500;
            font-size: 0.6rem;
            color: #94a3b8;
        }

        .loading, .error, .no-games {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .error {
            color: var(--accent-live);
        }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <div class="logo-area">
                <h1>Matt's CFP Scoreboard</h1>
                <div id="week-display" class="week-display">Loading week...</div>
                <div class="status-indicator">
                    <div class="pulse"></div>
                    <span id="update-status">Live (20s)</span>
                </div>
            </div>
            <div class="controls">
                <button id="wake-lock-btn" class="wake-lock-btn" onclick="toggleWakeLock()">
                    <div class="wake-dot"></div>
                    <span id="wake-btn-text">Stay Awake: Off</span>
                </button>

                <!-- Conference Filter -->
                <select id="conference-select" onchange="filterGames()">
                    <option value="all" selected>All Conferences</option>
                    <option value="SEC">SEC</option>
                    <option value="ACC">ACC</option>
                    <option value="Big Ten">Big Ten</option>
                    <option value="Big 12">Big 12</option>
                    <option value="AAC">AAC</option>
                    <option value="Mountain West">Mountain West</option>
                    <option value="Sun Belt">Sun Belt</option>
                    <option value="Conference USA">Conference USA</option>
                    <option value="MAC">MAC</option>
                </select>

                <!-- Status / Type Filter -->
                <select id="filter-select" onchange="filterGames()">
                    <option value="all" selected>All Games</option>
                    <option value="live">Live Only</option>
                    <option value="top25">Top 25 Only</option>
                    <option value="final">Finals Only</option>
                </select>
                <button onclick="fetchScores()">Refresh</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-box live">
                <span class="stat-label">Live</span>
                <span id="count-live" class="stat-value">0</span>
            </div>
            <div class="stat-box upcoming">
                <span class="stat-label">Upcoming</span>
                <span id="count-upcoming" class="stat-value">0</span>
            </div>
            <div class="stat-box final">
                <span class="stat-label">Final</span>
                <span id="count-final" class="stat-value">0</span>
            </div>
            <div class="stat-box total">
                <span class="stat-label">Total</span>
                <span id="count-total" class="stat-value">0</span>
            </div>
        </div>
    </header>

    <main>
        <div id="games-container" class="games-grid">
            <div class="loading">Loading college football scores...</div>
        </div>
    </main>

    <script>
        let allGamesData = [];
        let wakeLock = null;
        let countdownTimer = 20;

        async function toggleWakeLock() {
            const btn = document.getElementById('wake-lock-btn');
            const btnText = document.getElementById('wake-btn-text');

            if (!('wakeLock' in navigator)) {
                alert('Screen Wake Lock is not supported by your browser.');
                return;
            }

            try {
                if (wakeLock !== null) {
                    await wakeLock.release();
                    wakeLock = null;
                    btn.classList.remove('active');
                    btnText.textContent = 'Stay Awake: Off';
                } else {
                    wakeLock = await navigator.wakeLock.request('screen');
                    btn.classList.add('active');
                    btnText.textContent = 'Stay Awake: On';

                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                        btn.classList.remove('active');
                        btnText.textContent = 'Stay Awake: Off';
                    });
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
                btn.classList.remove('active');
                btnText.textContent = 'Stay Awake: Off';
            }
        }

        async function fetchScores() {
            const statusEl = document.getElementById('update-status');
            statusEl.textContent = 'Updating...';

            try {
                // Using group 80 to pull all FBS games cleanly without restrictions
                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300&t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                allGamesData = data.events || [];
                
                updateSeasonWeekDisplay(data);
                updateGlobalStats(allGamesData);
                renderGames();
                
                countdownTimer = 20;
                statusEl.textContent = `Live (${countdownTimer}s)`;
            } catch (error) {
                console.error("Error fetching scores:", error);
                statusEl.textContent = 'Error updating';
                const container = document.getElementById('games-container');
                if (allGamesData.length === 0) {
                    container.innerHTML = `<div class="error">Unable to load live scores right now. Please check your connection or try refreshing.</div>`;
                }
            }
        }

        function updateSeasonWeekDisplay(data) {
            const weekEl = document.getElementById('week-display');
            try {
                const weekNum = data.week?.number;
                const seasonType = data.week?.seasonType; 
                const calendar = data.leagues?.[0]?.calendar;
                
                let weekLabel = weekNum ? `Week ${weekNum}` : '';
                if (seasonType === 3) weekLabel = 'Bowl / Postseason';

                if (calendar && weekNum) {
                    const seasonEntry = calendar.find(c => c.value == seasonType) || calendar[0];
                    const entries = seasonEntry?.entries || [];
                    const currentEntry = entries.find(e => e.value == weekNum);
                    
                    if (currentEntry && currentEntry.startDate && currentEntry.endDate) {
                        const start = new Date(currentEntry.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        const end = new Date(currentEntry.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        weekEl.textContent = `${weekLabel} (${start} - ${end})`;
                        return;
                    }
                }
                weekEl.textContent = weekLabel || 'Current Week';
            } catch (e) {
                document.getElementById('week-display').textContent = 'College Football';
            }
        }

        function updateGlobalStats(games) {
            let live = 0;
            let upcoming = 0;
            let finalCount = 0;

            games.forEach(event => {
                const state = event.status.type.state;
                if (state === 'in') live++;
                else if (state === 'pre') upcoming++;
                else if (state === 'post') finalCount++;
            });

            document.getElementById('count-live').textContent = live;
            document.getElementById('count-upcoming').textContent = upcoming;
            document.getElementById('count-final').textContent = finalCount;
            document.getElementById('count-total').textContent = games.length;
        }

        function filterGames() {
            renderGames();
        }

        function formatUpcomingTime(dateString, detailString) {
            if (dateString) {
                try {
                    const gameDate = new Date(dateString);
                    if (!isNaN(gameDate)) {
                        const weekday = gameDate.toLocaleDateString('en-US', { weekday: 'short' });
                        const timeOnly = gameDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                        return `${weekday}, ${timeOnly}`;
                    }
                } catch (e) {}
            }

            if (!detailString) return '';
            if (detailString.includes('-')) {
                const parts = detailString.split(' - ');
                if (parts.length > 1) return parts[1].replace(/ (EDT|EST|CDT|CST|PDT|PST)/g, '').trim();
            }
            const commaParts = detailString.split(', ');
            if (commaParts.length >= 3) {
                return `${commaParts[0]}, ${commaParts[commaParts.length - 1].replace(/ (EDT|EST|CDT|CST|PDT|PST)/g, '')}`;
            }
            return detailString;
        }

        function renderGames() {
            const container = document.getElementById('games-container');
            const statusFilter = document.getElementById('filter-select').value;
            const confFilter = document.getElementById('conference-select').value;

            if (!allGamesData || allGamesData.length === 0) {
                container.innerHTML = `<div class="no-games">No games scheduled or available at the moment.</div>`;
                return;
            }

            let filtered = allGamesData.filter(event => {
                const statusState = event.status.type.state; 
                const competitions = event.competitions[0];
                const homeTeam = competitions.competitors.find(c => c.homeAway === 'home');
                const awayTeam = competitions.competitors.find(c => c.homeAway === 'away');
                const isTop25 = (homeTeam.curatedRank?.current <= 25) || (awayTeam.curatedRank?.current <= 25);

                // Status / Type Filter Match
                let matchesStatus = true;
                if (statusFilter === 'live') matchesStatus = (statusState === 'in');
                else if (statusFilter === 'final') matchesStatus = (statusState === 'post');
                else if (statusFilter === 'top25') matchesStatus = isTop25;

                if (!matchesStatus) return false;

                // Conference Filter Match (checks team names / affiliations explicitly)
                if (confFilter === 'all') return true;

                const homeText = (homeTeam.team.name + ' ' + homeTeam.team.shortDisplayName + ' ' + (homeTeam.team.conference?.name || '')).toLowerCase();
                const awayText = (awayTeam.team.name + ' ' + awayTeam.team.shortDisplayName + ' ' + (awayTeam.team.conference?.name || '')).toLowerCase();
                
                // Match exact conference selection string
                const matchesConf = homeText.includes(confFilter.toLowerCase()) || awayText.includes(confFilter.toLowerCase());
                
                return matchesConf;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-games">No games match your selected filters. Try resetting conferences or status filters.</div>`;
                return;
            }

            container.innerHTML = filtered.map(event => {
                const comp = event.competitions[0];
                const statusState = event.status.type.state; 
                const statusDetail = event.status.type.detail; 
                const gameDate = event.date; 
                const broadcast = comp.broadcasts?.[0]?.names?.[0] || '';

                const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
                const awayTeam = comp.competitors.find(c => c.homeAway === 'away');

                const homeScore = parseInt(homeTeam.score || 0);
                const awayScore = parseInt(awayTeam.score || 0);

                let homeWinner = false;
                let awayWinner = false;
                if (statusState === 'post') {
                    if (homeScore > awayScore) homeWinner = true;
                    else if (awayScore > homeScore) awayWinner = true;
                }

                let statusClass = 'upcoming';
                let statusText = statusDetail;
                if (statusState === 'in') {
                    statusClass = 'live';
                } else if (statusState === 'post') {
                    statusClass = 'final';
                    statusText = 'FINAL';
                } else {
                    statusText = formatUpcomingTime(gameDate, statusDetail);
                }

                const homeRank = homeTeam.curatedRank?.current <= 25 ? `#${homeTeam.curatedRank.current} ` : '';
                const awayRank = awayTeam.curatedRank?.current <= 25 ? `#${awayTeam.curatedRank.current} ` : '';

                return `
                    <div class="game-card">
                        <div class="game-header">
                            <span class="game-status ${statusClass}">${statusText}</span>
                            <span class="broadcast">${broadcast}</span>
                        </div>
                        <div class="teams-list">
                            <div class="team-row ${awayWinner ? 'winner' : ''}">
                                <div class="team-info">
                                    <img class="team-logo" src="${awayTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                    <span class="team-name">${awayRank}${awayTeam.team.shortDisplayName || awayTeam.team.name}</span>
                                </div>
                                <span class="team-score">${awayTeam.score ?? '0'}</span>
                            </div>
                            <div class="team-row ${homeWinner ? 'winner' : ''}">
                                <div class="team-info">
                                    <img class="team-logo" src="${homeTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                    <span class="team-name">${homeRank}${homeTeam.team.shortDisplayName || homeTeam.team.name}</span>
                                </div>
                                <span class="team-score">${homeTeam.score ?? '0'}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchScores();

        setInterval(() => {
            const statusEl = document.getElementById('update-status');
            if (statusEl.textContent.includes('Updating')) return;

            countdownTimer--;
            if (countdownTimer <= 0) {
                fetchScores();
            } else {
                statusEl.textContent = `Live (${countdownTimer}s)`;
            }
        }, 1000);
    </script>
</body>
</html>
