<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFB Live Monitor - Compact Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-live: #ef4444;
            --accent-final: #64748b;
            --accent-upcoming: #3b82f6;
            --highlight: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 12px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
        }

        select:focus, button:focus {
            outline: 1px solid var(--highlight);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--accent-live);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }

        /* Stat Counter Boxes */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.03em;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1rem;
            font-variant-numeric: tabular-nums;
        }

        .stat-box.live .stat-value { color: var(--accent-live); }
        .stat-box.final .stat-value { color: var(--accent-final); }
        .stat-box.upcoming .stat-value { color: var(--accent-upcoming); }
        .stat-box.total .stat-value { color: var(--text-main); }

        /* Responsive Grid: Perfectly balances tablet (3 cols) and desktop (~4-5 cols) */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        /* Game Box */
        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: border-color 0.15s ease;
        }

        .game-card:hover {
            border-color: var(--text-muted);
        }

        /* Header Info (Clock & Quarter) */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .game-status.live {
            color: var(--accent-live);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
        }

        .game-status.live::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--accent-live);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .game-status.final {
            color: var(--accent-final);
            font-size: 0.72rem;
        }

        .game-status.upcoming {
            color: var(--text-muted);
            font-size: 0.62rem;
            text-transform: none;
            font-weight: 500;
        }

        /* Teams section - optimized for legibility */
        .teams-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            padding-right: 6px;
        }

        .team-logo {
            width: 16px;
            height: 16px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .team-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-row.winner .team-name,
        .team-row.winner .team-score {
            font-weight: 700;
            color: var(--text-main);
        }

        .team-row:not(.winner) .team-name,
        .team-row:not(.winner) .team-score {
            color: var(--text-muted);
        }

        .team-score {
            font-variant-numeric: tabular-nums;
            font-size: 0.92rem;
            flex-shrink: 0;
        }

        /* Broadcast / Situation Footer */
        .game-footer {
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .broadcast {
            font-weight: 500;
        }

        .situation {
            color: #fbbf24;
            font-weight: 500;
        }

        /* States */
        .loading, .error, .no-games {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .error {
            color: var(--accent-live);
        }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <div class="logo-area">
                <h1>CFB Live</h1>
                <div class="status-indicator">
                    <div class="pulse"></div>
                    <span id="update-status">Live</span>
                </div>
            </div>
            <div class="controls">
                <!-- Conference Filter -->
                <select id="conference-select" onchange="filterGames()">
                    <option value="all" selected>All Conferences</option>
                    <option value="8">SEC</option>
                    <option value="1">ACC</option>
                    <option value="4">Big Ten</option>
                    <option value="151">Big 12</option>
                    <option value="9">Pac-12</option>
                    <option value="12">AAC</option>
                    <option value="17">Mountain West</option>
                    <option value="15">Sun Belt</option>
                    <option value="37">Conference USA</option>
                    <option value="152">MAC</option>
                    <option value="18">FBS Independents</option>
                </select>

                <!-- Status Filter -->
                <select id="filter-select" onchange="filterGames()">
                    <option value="all" selected>All Games Status</option>
                    <option value="live">Live Only</option>
                    <option value="top25">Top 25 Only</option>
                    <option value="final">Finals Only</option>
                </select>
                <button onclick="fetchScores()">Refresh</button>
            </div>
        </div>

        <!-- Summary Stat Counters Bar -->
        <div class="stats-bar">
            <div class="stat-box live">
                <span class="stat-label">Live</span>
                <span id="count-live" class="stat-value">0</span>
            </div>
            <div class="stat-box upcoming">
                <span class="stat-label">Upcoming</span>
                <span id="count-upcoming" class="stat-value">0</span>
            </div>
            <div class="stat-box final">
                <span class="stat-label">Final</span>
                <span id="count-final" class="stat-value">0</span>
            </div>
            <div class="stat-box total">
                <span class="stat-label">Total</span>
                <span id="count-total" class="stat-value">0</span>
            </div>
        </div>
    </header>

    <main>
        <div id="games-container" class="games-grid">
            <div class="loading">Loading college football scores...</div>
        </div>
    </main>

    <script>
        let allGamesData = [];

        async function fetchScores() {
            const container = document.getElementById('games-container');
            const statusEl = document.getElementById('update-status');
            statusEl.textContent = 'Updating...';

            try {
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                allGamesData = data.events || [];
                
                updateGlobalStats(allGamesData);
                renderGames();
                statusEl.textContent = 'Live';
            } catch (error) {
                console.error("Error fetching scores:", error);
                statusEl.textContent = 'Error updating';
                if (allGamesData.length === 0) {
                    container.innerHTML = `<div class="error">Unable to load live scores right now. Please check your connection or try refreshing.</div>`;
                }
            }
        }

        function updateGlobalStats(games) {
            let live = 0;
            let upcoming = 0;
            let finalCount = 0;

            games.forEach(event => {
                const state = event.status.type.state;
                if (state === 'in') live++;
                else if (state === 'pre') upcoming++;
                else if (state === 'post') finalCount++;
            });

            document.getElementById('count-live').textContent = live;
            document.getElementById('count-upcoming').textContent = upcoming;
            document.getElementById('count-final').textContent = finalCount;
            document.getElementById('count-total').textContent = games.length;
        }

        function filterGames() {
            renderGames();
        }

        function renderGames() {
            const container = document.getElementById('games-container');
            const statusFilter = document.getElementById('filter-select').value;
            const confFilter = document.getElementById('conference-select').value;

            if (!allGamesData || allGamesData.length === 0) {
                container.innerHTML = `<div class="no-games">No games scheduled or available at the moment.</div>`;
                return;
            }

            let filtered = allGamesData.filter(event => {
                const statusState = event.status.type.state; 
                const competitions = event.competitions[0];
                const homeTeam = competitions.competitors.find(c => c.homeAway === 'home');
                const awayTeam = competitions.competitors.find(c => c.homeAway === 'away');
                const isTop25 = (homeTeam.curatedRank?.current <= 25) || (awayTeam.curatedRank?.current <= 25);

                let matchesStatus = true;
                if (statusFilter === 'live') matchesStatus = (statusState === 'in');
                else if (statusFilter === 'final') matchesStatus = (statusState === 'post');
                else if (statusFilter === 'top25') matchesStatus = isTop25;

                if (!matchesStatus) return false;

                if (confFilter === 'all') return true;

                const homeGroups = homeTeam.team.groups?.id || '';
                const awayGroups = awayTeam.team.groups?.id || '';
                
                const matchConf = (
                    homeTeam.team.conferenceId === confFilter || 
                    awayTeam.team.conferenceId === confFilter ||
                    String(homeGroups).includes(confFilter) ||
                    String(awayGroups).includes(confFilter)
                );

                return matchConf;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-games">No games match your selected filters. Try resetting conferences or status filters.</div>`;
                return;
            }

            container.innerHTML = filtered.map(event => {
                const comp = event.competitions[0];
                const statusState = event.status.type.state; 
                const statusDetail = event.status.type.detail; 
                const broadcast = comp.broadcasts?.[0]?.names?.[0] || '';
                const situation = comp.situation ? comp.situation.downDistanceText : '';

                const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
                const awayTeam = comp.competitors.find(c => c.homeAway === 'away');

                const homeScore = parseInt(homeTeam.score || 0);
                const awayScore = parseInt(awayTeam.score || 0);

                let homeWinner = false;
                let awayWinner = false;
                if (statusState === 'post') {
                    if (homeScore > awayScore) homeWinner = true;
                    else if (awayScore > homeScore) awayWinner = true;
                }

                let statusClass = 'upcoming';
                let statusText = statusDetail;
                if (statusState === 'in') {
                    statusClass = 'live';
                } else if (statusState === 'post') {
                    statusClass = 'final';
                    statusText = 'FINAL';
                }

                const homeRank = homeTeam.curatedRank?.current <= 25 ? `#${homeTeam.curatedRank.current} ` : '';
                const awayRank = awayTeam.curatedRank?.current <= 25 ? `#${awayTeam.curatedRank.current} ` : '';

                return `
                    <div class="game-card">
                        <div class="game-header">
                            <span class="game-status ${statusClass}">${statusText}</span>
                            <span class="broadcast">${broadcast}</span>
                        </div>
                        <div class="teams-list">
                            <div class="team-row ${awayWinner ? 'winner' : ''}">
                                <div class="team-info">
                                    <img class="team-logo" src="${awayTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                    <span class="team-name">${awayRank}${awayTeam.team.shortDisplayName || awayTeam.team.name}</span>
                                </div>
                                <span class="team-score">${awayTeam.score ?? '0'}</span>
                            </div>
                            <div class="team-row ${homeWinner ? 'winner' : ''}">
                                <div class="team-info">
                                    <img class="team-logo" src="${homeTeam.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                    <span class="team-name">${homeRank}${homeTeam.team.shortDisplayName || homeTeam.team.name}</span>
                                </div>
                                <span class="team-score">${homeTeam.score ?? '0'}</span>
                            </div>
                        </div>
                        ${situation || (statusState === 'in' && event.status.period) ? `
                        <div class="game-footer">
                            <span class="situation">${situation || ''}</span>
                            <span></span>
                        </div>` : ''}
                    </div>
                `;
            }).join('');
        }

        fetchScores();
        setInterval(fetchScores, 20000);
    </script>
</body>
</html>
